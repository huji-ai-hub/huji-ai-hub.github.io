[project]
name = "huji-ai-hub-updater-bot"
version = "0.1.0"
description = "Scheduled AI-driven content updater for the HUJI AI Hub website."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "HUJI AI Hub" },
]

dependencies = [
    "httpx>=0.27,<1.0",
    "beautifulsoup4>=4.12,<5.0",
    "lxml>=5.1,<6.0",
    "anthropic>=0.40,<1.0",
    "PyGithub>=2.3,<3.0",
    "python-frontmatter>=1.1,<2.0",
    "pydantic>=2.7,<3.0",
    "tomli>=2.0; python_version<'3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
huji-updater = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
